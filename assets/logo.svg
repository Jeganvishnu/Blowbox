<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <!-- Blue Ribbon Gradient -->
    <linearGradient id="bb-blue-grad" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="45%" stop-color="#00a2ff"/>
      <stop offset="100%" stop-color="#00d8ff"/>
    </linearGradient>

    <!-- Gold Ribbon Gradient -->
    <linearGradient id="bb-gold-grad" x1="30" y1="40" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Box Top Gold Gradient -->
    <linearGradient id="bb-cube-gold" x1="45" y1="35" x2="85" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffec99"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Box Front Blue Gradient -->
    <linearGradient id="bb-cube-blue-front" x1="65" y1="65" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#003899"/>
    </linearGradient>

    <!-- Box Side Blue Gradient -->
    <linearGradient id="bb-cube-blue-side" x1="25" y1="65" x2="65" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0055cc"/>
      <stop offset="100%" stop-color="#002266"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="bb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Gradient -->
    <linearGradient id="bb-text-blue" x1="340" y1="60" x2="490" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <!-- 3D 'B' EMBLEM -->
  <g transform="translate(10, 10)">
    <!-- Gold Inner Bevel of B -->
    <path d="M 35 15 L 75 15 C 95 15, 110 26, 110 44 C 110 57, 102 67, 88 71 C 108 75, 120 88, 120 106 C 120 126, 100 138, 75 138 L 35 138 Z" 
          fill="url(#bb-gold-grad)" opacity="0.95" />

    <!-- Outer Blue Ribbon Wing -->
    <path d="M 30 10 L 76 10 C 98 10, 115 22, 115 42 C 115 54, 106 64, 92 68 C 112 72, 126 86, 126 106 C 126 128, 104 142, 76 142 L 30 142 L 30 10 Z 
             M 45 26 L 45 60 L 72 60 C 82 60, 92 54, 92 43 C 92 32, 82 26, 72 26 Z 
             M 45 76 L 45 124 L 75 124 C 88 124, 100 116, 100 100 C 100 84, 88 76, 75 76 Z" 
          fill="url(#bb-blue-grad)" />

    <!-- Central Isometric 3D Code Box -->
    <g transform="translate(42, 45) scale(0.65)">
      <!-- Top Face (Gold) -->
      <polygon points="40,0 75,18 40,36 5,18" fill="url(#bb-cube-gold)" />
      <!-- Left Face (Deep Blue) -->
      <polygon points="5,18 40,36 40,75 5,57" fill="url(#bb-cube-blue-side)" />
      <!-- Right Face (Vibrant Blue with Code Glyph) -->
      <polygon points="40,36 75,18 75,57 40,75" fill="url(#bb-cube-blue-front)" />
      <!-- Glowing Code Glyph </> on Front/Right Face -->
      <g transform="translate(44, 40) skewY(-14) scale(0.75)" filter="url(#bb-glow)">
        <path d="M 8 16 L 2 10 L 8 4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <line x1="12" y1="18" x2="16" y2="2" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 20 4 L 26 10 L 20 16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
    </g>

    <!-- Floating Digital Voxels (Top-Right of B) -->
    <rect x="122" y="14" width="13" height="13" rx="2" fill="#00a6ff" />
    <rect x="138" y="0" width="14" height="14" rx="2" fill="#0088ff" />
    <rect x="130" y="32" width="12" height="12" rx="2" fill="#f59e0b" />
    <rect x="145" y="24" width="11" height="11" rx="2" fill="#ffd166" />
    <rect x="148" y="44" width="10" height="10" rx="2" fill="#00d2ff" />
    <rect x="136" y="56" width="9" height="9" rx="2" fill="#f59e0b" />
  </g>

  <!-- TYPOGRAPHY: "BLOW BOX" -->
  <g transform="translate(185, 96)">
    <!-- "BLOW" in Dark Navy with Subtle Gradient -->
    <text x="0" y="0" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="#ffffff">BLOW</text>
    <!-- "BOX" in Electric Cyan Gradient -->
    <text x="175" y="0" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="url(#bb-text-blue)">BOX</text>
    <!-- Subtitle: SOFTWARE SOLUTIONS -->
    <text x="2" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="7" fill="rgba(255, 255, 255, 0.65)">SOFTWARE SOLUTIONS</text>
  </g>
</svg>
